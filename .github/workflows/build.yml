name: Build Release APK

on:
  push:
    branches: ["**"]
    # 纯文档改动不产出 APK：一次构建要跑 20 分钟，只改 README 或 docs/
    # 时没必要占一次 runner，也没必要让 latest 多一个内容相同的包。
    # 提交里只要有一个非文档文件，仍然照常构建。
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的 commit / 分支 / tag（留空 = 当前分支 HEAD）。回滚用：填旧 commit。"
        required: false
        default: ""

# A 批：同一 ref 的构建串行，避免两个 run 的发布步骤交错。
# 之前 304 的发布在 305 之后完成，把 latest 覆盖成旧包（latest=v1.304，HEAD=run 305）。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # 固定 24.04，不用 ubuntu-latest。
    #
    # 2026-11-11：ubuntu-latest 迁到 26.04（resolute）后，runner 解析不到
    # `security.ubuntu.com` / `archive.ubuntu.com`，`Install Vulkan shader toolchain`
    # 里的 apt-get 连续三次红在 `Temporary failure resolving 'security.ubuntu.com'`，
    # 而同一份代码在迁移前的镜像上是绿的。这不是代码问题，是镜像的源配置问题。
    #
    # 固定版本比"等它修好"可靠：出包链路不该依赖一个会自己变的标签。24.04 上
    # glslc / spirv-headers / libvulkan-dev 都能正常装（脚本本来就走 dpkg -L 动态找路径，
    # 不写死版本）。
    runs-on: ubuntu-24.04
    # 发布 Release（gh release create/upload）需要写仓库内容的权限
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # W-41：回滚时用旧 commit 重新出包。版本号取自 run number，天然比旧包大，
          # 可覆盖安装、不丢数据（Android 不允许版本号倒退的包覆盖安装）。
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (手动安装，避免 setup-android action 在现行 runner 上损坏)
        run: |
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          # 注意：追加 $GITHUB_PATH 对同一 step 内不生效，必须显式 export PATH
          export ANDROID_HOME=$SDK
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null
          # NDK 26.3 + cmake 3.22.1：本地 llama.cpp 推理（九步第 3 步）native 构建用
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      # 缓存 llama.cpp 源码（~50MB，每次 clone 几分钟）与 CMake 产物。
      #
      # 为什么要缓存：`assembleDebug` 在 CI 上约 5 分钟，其中 lama.cpp 的
      # 拉取 + NDK 编译占大头。源码按固定 tag（v0.7.0）拉取，内容稳定，天然适合缓存。
      # key 里带 tag：换版本时自动失效，不会拿到旧源码。
      #
      # 注意：**只缓存源码，不缓存 .so**。缓存二进制会让"改了 C++ 却没重编"变成
      # 一个静默的坑（本地改了 jni 代码，CI 拿旧 .so 出包，行为对不上源码）。
      - name: Cache llama.cpp source
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/llama.cpp
          key: llama-src-v070-${{ runner.os }}
          restore-keys: |
            llama-src-v070-

      - name: Point local.properties to SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Fetch llama.cpp v0.7.0 (构建时拉取，不进仓库)
        run: ./scripts/fetch-llama.sh git

      - name: Fetch Shizuku APK (内置一键安装用，构建时拉取，不进仓库)
        # 不阻断构建：共享 runner IP 匿名调用 GitHub API 极易 429/403（限流）。
        # 拿不到就跳过内置包——应用会退到官方发布页，功能不缺失，只是少一步便利。
        #
        # 2026-10-22 修：匿名调 API 被限流 → 包内没有 assets/shizuku.apk →
        # apk 反验判 FAIL → QA 门禁把整次构建打红（fbd4c0d / 6196648 两连红）。
        # 两处一起改：① 带 token 调 API（配额从 60/h 提到 5000/h）；
        #              ② 下载没成功时导出标记，让反验把这一项判为 SKIP 而不是 FAIL
        #                 （「CI 没拉到」和「代码把资产弄丢了」是两件事，不能同一个判定）。
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets
          # 同时取 browser_download_url 与 asset id：前者走 github.com，后者走
          # api.github.com → release-assets.githubusercontent.com，是两条不同的链路。
          # 2026-11-08 起 github.com 的 releases 下载持续 504（Gradle 分发包同一根因），
          # 只剩 API 这条能用，所以必须留兜底。
          META=$(curl -sSL --max-time 60 \
                  -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                  -H "Accept: application/vnd.github+json" \
                  https://api.github.com/repos/RikkaApps/Shizuku/releases/latest 2>/dev/null \
                | python3 -c "import json,sys;d=json.load(sys.stdin);a=[x for x in d.get('assets',[]) if x['name'].endswith('.apk')];print(f\"{a[0]['browser_download_url']} {a[0]['id']}\" if a else '')" 2>/dev/null || true)
          URL=${META%% *}
          AID=${META##* }
          if [ -n "$URL" ]; then
            echo "downloading $URL"
            if ! curl -fL --retry 3 --retry-delay 5 --max-time 180 "$URL" -o app/src/main/assets/shizuku.apk; then
              echo "WARN: 直链失败（github.com 504），改走 API asset 接口"
              rm -f app/src/main/assets/shizuku.apk
              curl -fL --retry 3 --retry-delay 5 --max-time 180 \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/octet-stream" \
                "https://api.github.com/repos/RikkaApps/Shizuku/releases/assets/$AID" \
                -o app/src/main/assets/shizuku.apk \
                || { rm -f app/src/main/assets/shizuku.apk; echo "WARN: 下载失败，跳过内置安装包"; }
            fi
          else
            echo "WARN: 未找到 Shizuku APK（API 限流或发布变更），跳过内置安装包（应用会退到官方发布页）"
          fi
          # 给下游反验一个明确信号：没拉到 ≠ 代码有问题
          if [ ! -s app/src/main/assets/shizuku.apk ]; then
            echo "POLARIS_SHIZUKU_ASSET=absent" >> "$GITHUB_ENV"
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Vulkan（GPU）后端要四样东西，缺一样都编不出来：
      #   1. glslc                    —— 把 .comp 编成 SPIR-V（host 侧可执行）
      #   2. SPIRV-Headers 的 CMake 包 —— ggml-vulkan 里是 find_package(... CONFIG REQUIRED)
      #   3. vulkan.h + libvulkan.so   —— NDK sysroot 自带
      #   4. vulkan.hpp + spirv.hpp    —— NDK **不带**，要从宿主的 libvulkan-dev 拿
      #
      # 为什么在 CI 装而不是让 CMake 自己下：交叉编译时 find_package 会撞上
      # CMAKE_FIND_ROOT_PATH（只在 sysroot 里搜），首轮必然失败；而下载这件事本来
      # 就属于 CI，不该混进构建脚本——本地开发者没这套工具时应当静默退回 CPU-only。
      #
      # 装完当场验证路径，而不是等 CMake 报错：这一段的失败信息比 CMake 的清楚得多。
      - name: Install Vulkan shader toolchain (glslc + SPIRV-Headers + Vulkan-Hpp)
        run: |
          set -euo pipefail

          # 2026-11-11：runner 的 DNS 一度解析不到任何 apt 源（azure.archive.ubuntu.com /
          # archive.ubuntu.com / security.ubuntu.com 同时报 Temporary failure resolving），
          # 三次重跑都撞在这一步，而同一份代码当天早上的构建是绿的。这是 runner 侧的
          # 网络故障，不是仓库问题——但出包链路不能靠"等它自己好"。
          #
          # 兜底：系统 DNS 解析不了就换公共 DNS 再装。装不上仍然红（不静默降级：
          # 没有 glslc 就编不出 Vulkan backend，出一个"看着正常但本地推理慢一截"的包更糟）。
          if ! getent hosts archive.ubuntu.com >/dev/null 2>&1; then
            echo "DNS 解析不到 archive.ubuntu.com —— 改用 8.8.8.8 / 1.1.1.1" >&2
            sudo rm -f /etc/resolv.conf
            printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\n' | sudo tee /etc/resolv.conf >/dev/null
          fi

          sudo apt-get update -qq || true
          # -o Acquire::Retries=3：单个 .deb 拉一半断掉时 apt 自己重试，不必整个 job 重来。
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            glslc spirv-headers libvulkan-dev
          GLSLC="$(command -v glslc)"
          SPIRV_DIR="$(dirname "$(dpkg -L spirv-headers | grep -E 'SPIRV-HeadersConfig\.cmake$' | head -1)")"

          # 只把 vulkan/ 与 spirv/ 两个目录挂进一个空目录，给 NDK 编译用。
          #
          # 为什么不能直接 -I/usr/include：-I 排在 -isystem 之前，而 NDK 的 bionic 头
          # 在 -isystem 里。整个 /usr/include 一挂上去，glibc 的 stdio.h / stdint.h 就会
          # 盖掉 bionic 的，编译能过一阵子然后在莫名其妙的地方炸（或者更糟：链接到 glibc）。
          VKINC="$RUNNER_TEMP/vkinc"
          mkdir -p "$VKINC"
          ln -sfn /usr/include/vulkan   "$VKINC/vulkan"
          ln -sfn /usr/include/spirv    "$VKINC/spirv"
          # vulkan_core.h 里 include 了 vk_video/*（视频编解码结构体）。NV 的 coop-matrix
          # 之类都在别处，但这一组是 core 头硬依赖，少一个就直接 fatal。
          ln -sfn /usr/include/vk_video "$VKINC/vk_video"

          echo "glslc      = $GLSLC"
          echo "spirv-dir  = $SPIRV_DIR"
          echo "vkinc      = $VKINC"
          glslc --version | head -3
          ls -l "$VKINC"
          test -x "$GLSLC"
          test -f "$SPIRV_DIR/SPIRV-HeadersConfig.cmake"
          test -f "$VKINC/vulkan/vulkan.hpp"
          test -f "$VKINC/spirv/unified1/spirv.hpp"
          test -f "$VKINC/vk_video/vulkan_video_codec_h264std.h"
          {
            echo "AK_GLSLC=$GLSLC"
            echo "AK_SPIRV_DIR=$SPIRV_DIR"
            echo "AK_VULKAN_INCLUDE=$VKINC"
            # CI 里必须失败而不是静默降级：否则「以为开了 GPU，出的包其实只有 CPU」，
            # 而这种包在真机上不会报任何错，只是慢。
            echo "AK_REQUIRE_VULKAN=1"
          } >> "$GITHUB_ENV"

      # 签名：私钥只存在 Actions Secrets 里，构建时才解到 runner 的临时目录。
      # 解出来的文件放在 $RUNNER_TEMP（不在工作树内），即使后续步骤把工作树打包上传
      # 也带不走私钥。POLARIS_REQUIRE_RELEASE_KEY=1 让 Gradle 在 secret 缺失时直接失败——
      # 否则会静默回退 debug 证书，产出一个「以后永远升不了级」的包。
      - name: Decode signing key (私钥不进仓库)
        env:
          KEYSTORE_B64: ${{ secrets.POLARIS_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.POLARIS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POLARIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POLARIS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::缺少 secret POLARIS_KEYSTORE_B64，拒绝构建可发布包"
            exit 1
          fi
          KS="$RUNNER_TEMP/polaris-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          # 解出来的必须是一把能打开的钥匙：口令错/文件截断在这里就暴露，
          # 而不是等到 assembleDebug 末尾报一句 "Failed to read key"
          keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          {
            echo "POLARIS_KEYSTORE=$KS"
            echo "POLARIS_STORE_PASSWORD=$STORE_PASSWORD"
            echo "POLARIS_KEY_ALIAS=$KEY_ALIAS"
            echo "POLARIS_KEY_PASSWORD=$KEY_PASSWORD"
            echo "POLARIS_REQUIRE_RELEASE_KEY=1"
          } >> "$GITHUB_ENV"
          # 指纹写进日志：以后核对「某个包是不是这台机器签的」不用再翻本机 keystore
          keytool -list -v -keystore "$KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -E "SHA256:|Valid from" || true

      - name: Build release APK
        # 一次 Gradle 调用里同时做两件事：
        #  1. assembleRelease —— 发布物（debuggable=false，见 app/build.gradle.kts）；
        #  2. compileDebugKotlin —— 仅**编译** debug 变体，不打包。
        #
        # 为什么还要 debug 的 class：四十多个 QA harness 拿
        # app/build/tmp/kotlin-classes/debug 当 classpath（qa_classpath 优先 debug）。
        # 只出 release 包时它们会整片 SKIP——gate 不报红，但验证面凭空消失，
        # 这比报红更危险。debug 只编到 Kotlin 字节码，不触发 native / dex / 资源打包，
        # 增量约一分钟；release 的 llama.cpp 编译才是大头，两者互不复用但只多这一份开销。
        run: |
          ./gradlew assembleRelease :app:compileDebugKotlin :core:compileDebugKotlin \
            --no-daemon --stacktrace

      # 指纹与包名守卫：构建出来的包必须由**这一把**钥匙签、必须叫**这一个**包名。
      #
      # 为什么要在 CI 里守：这两种错原来的暴露点都是用户点安装时系统弹一句
      # 「应用未安装 / 签名不符」——那时包已经发出去几百次下载了。指纹和包名都是
      # 公开信息，写进仓库没有风险；换来的是「钥匙被换错、Secrets 被覆盖、包名被改」
      # 在构建阶段就拦下，而不是到手机上才发现。判据与 docs/ops/SIGNING.md 一致。
      - name: Verify APK identity (包名 + 签名指纹)
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "${BT:-}" ]; then
            echo "::error::找不到 build-tools，无法验签"
            exit 1
          fi

          EXPECT="097f9cb0d27d585043a0174d58a24c27a5fabdb661c3cc6f003cac64e7de9439"
          GOT=$("$BT/apksigner" verify --print-certs "$APK" \
                | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 \
                | tr -d ':' | tr 'A-F' 'a-f')
          echo "apk       : $APK"
          echo "sha256    : $GOT"
          echo "expected  : $EXPECT"
          if [ "$GOT" != "$EXPECT" ]; then
            echo "::error::APK 签名指纹与 docs/ops/SIGNING.md 记录的不一致，拒绝发布"
            exit 1
          fi

          BADGING=$("$BT/aapt2" dump badging "$APK" 2>/dev/null | head -1 || true)
          if [ -n "$BADGING" ]; then
            echo "$BADGING"
            echo "$BADGING" | grep -q "package: name='com.beichen.polaris'" \
              || { echo "::error::包名不是 com.beichen.polaris，老用户无法覆盖升级"; exit 1; }
          else
            echo "::warning::aapt2 dump badging 无输出，跳过包名校验"
          fi

          # A-6：发布包绝不能是 debuggable —— 那等于把「同机任意应用可 run-as 读私有目录」
          # 免费送给所有用户，而私有目录里有**明文存的 API Key**。
          #
          # 为什么现在才需要这条：修前 CI 直接发 `assembleDebug` 的产物，所以每个用户手上
          # 都是 debuggable=true 的包，而「装得上、跑得动」不会暴露任何异常。
          # 判据用 xmltree 而非 badging：badging 对 application-debuggable 的输出
          # 在不同 aapt2 版本间不一致，xmltree 是 manifest 原文展开，判据唯一。
          DEBUGGABLE=$("$BT/aapt2" dump xmltree "$APK" --file AndroidManifest.xml 2>/dev/null \
                       | grep -c "android:debuggable" || true)
          echo "debuggable: ${DEBUGGABLE:-0}（必须为 0）"
          if [ "${DEBUGGABLE:-0}" != "0" ]; then
            echo "::error::发布包 debuggable=true，拒绝发布（run-as 可读走明文 API Key）"
            echo "::error::多半是构建了 debug 变体：CI 必须用 ./gradlew assembleRelease"
            exit 1
          fi

      # CI runner 没有预装 kotlinc 发行版，但 Gradle 已经下过 kotlin-compiler-embeddable。
      # 这里包一层同名命令，让只认 `$KOTLINC_HOME/bin/kotlinc` 的老 harness 也能跑。
      - name: Prepare kotlinc shim (老 harness 只认 kotlinc 命令)
        if: ${{ vars.QA_HARNESS != 'off' }}
        continue-on-error: true
        run: |
          CACHE="$HOME/.gradle/caches/modules-2/files-2.1"
          KJAR=$(find "$CACHE/org.jetbrains.kotlin/kotlin-compiler-embeddable" -name 'kotlin-compiler-embeddable-*.jar' 2>/dev/null | grep -v sources | head -1)
          STD=$(find "$CACHE/org.jetbrains.kotlin/kotlin-stdlib" -name 'kotlin-stdlib-*.jar' 2>/dev/null | grep -v sources | head -1)
          TROVE=$(find "$CACHE/org.jetbrains.intellij.deps/trove4j" -name 'trove4j-*.jar' 2>/dev/null | head -1)
          ANN=$(find "$CACHE/org.jetbrains/annotations" -name 'annotations-*.jar' 2>/dev/null | head -1)
          if [ -z "$KJAR" ] || [ -z "$STD" ]; then
            echo "WARN: 缓存里没有 kotlin 编译器，跳过 shim（相关 harness 会自行 SKIP）"
            exit 0
          fi
          mkdir -p /tmp/kotlinc/bin
          # 老 harness 还会直接引用 $KC_HOME/lib/kotlin-stdlib.jar，一并放好
          mkdir -p /tmp/kotlinc/lib
          cp "$STD" /tmp/kotlinc/lib/kotlin-stdlib.jar
          # 早期批次脚本把这两个路径写死成了本机临时目录，这里复原（找不到就退化成 SKIP）
          mkdir -p /tmp/w7-jars
          SER_JSON=$(find "$CACHE/org.jetbrains.kotlinx/kotlinx-serialization-json-jvm" -name 'kotlinx-serialization-json-jvm-*.jar' 2>/dev/null | grep -v sources | head -1)
          SER_CORE=$(find "$CACHE/org.jetbrains.kotlinx/kotlinx-serialization-core-jvm" -name 'kotlinx-serialization-core-jvm-*.jar' 2>/dev/null | grep -v sources | head -1)
          [ -n "$SER_JSON" ] && cp "$SER_JSON" /tmp/w7-jars/kotlinx-serialization-json-jvm-1.6.3.jar
          [ -n "$SER_CORE" ] && cp "$SER_CORE" /tmp/w7-jars/kotlinx-serialization-core-jvm-1.6.3.jar
          # 序列化编译器插件（-Xplugin 用）。必须与编译器同为 embeddable 变体：
          # 非 embeddable 插件配 embeddable 编译器会在编译期内部崩溃（exit=2）。
          curl -sSL --max-time 120 \
            https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-serialization-compiler-plugin-embeddable/1.9.25/kotlin-serialization-compiler-plugin-embeddable-1.9.25.jar \
            -o /tmp/kotlinc/lib/kotlinx-serialization-compiler-plugin.jar \
            && ls -lh /tmp/kotlinc/lib/kotlinx-serialization-compiler-plugin.jar || echo "WARN: 序列化插件下载失败"
          {
            echo '#!/usr/bin/env bash'
            # 官方 kotlinc 会自动带上 stdlib；直接调 K2JVMCompiler 不会。调用方可能写 -cp
            # 也可能写 -classpath，只「前置注入 STD」会被后面的 -cp 覆盖，等于没注入——
            # CI 上 r10/r12/capability-manifest/kernel-exposure 就是这么缺 stdlib 的
            # （报 cannot access built-in declaration 'kotlin.Int' / cannot infer type）。
            # 统一重写成 -classpath "<原值>:$STD"，两种写法都吃到标准库。
            echo 'STD="'"$STD"'"'
            echo 'ARGS=(); HAVE_CP=0'
            echo 'while [ $# -gt 0 ]; do'
            echo '  case "$1" in'
            echo '    -cp|-classpath) ARGS+=("-classpath" "$2:$STD"); HAVE_CP=1; shift 2;;'
            echo '    *) ARGS+=("$1"); shift;;'
            echo '  esac'
            echo 'done'
            echo 'if [ "$HAVE_CP" = 0 ]; then ARGS=(-classpath "$STD" "${ARGS[@]}"); fi'
            echo "exec java -cp \"$KJAR:$STD:$TROVE:$ANN\" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler \"\${ARGS[@]}\""
          } > /tmp/kotlinc/bin/kotlinc
          chmod +x /tmp/kotlinc/bin/kotlinc
          /tmp/kotlinc/bin/kotlinc -version

      # 二维码对拍（W-RT8）需要一个现成解码库当「考官」：自写编码器自己看着像没用，
      # 得让第三方解码器把矩阵解回文本对上才算数。harness 自己也会尝试下载，
      # 这一步只是提前拿好、失败也不阻塞（拿不到时该 harness 会明确 SKIP 而不是假绿）。
      - name: Prefetch zxing (二维码对拍考官)
        if: ${{ vars.QA_HARNESS != 'off' }}
        continue-on-error: true
        run: |
          for u in \
            "https://repo1.maven.org/maven2/com/google/zxing/core/3.5.3/core-3.5.3.jar" \
            "https://maven.aliyun.com/repository/public/com/google/zxing/core/3.5.3/core-3.5.3.jar" \
            "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/com/google/zxing/core/3.5.3/core-3.5.3.jar"
          do
            curl -sSL --max-time 120 -o /tmp/zxing-core-3.5.3.jar "$u" && [ -s /tmp/zxing-core-3.5.3.jar ] && break
            rm -f /tmp/zxing-core-3.5.3.jar
          done
          ls -lh /tmp/zxing-core-3.5.3.jar || echo "WARN: 考官包没取到，二维码对拍会 SKIP（编码器未被外部验证）"

      # QA harness：把仓库里全部断言跑一遍（纯 JVM + APK 静态反验）。
      #
      # 这一步本身保持「只报告」（continue-on-error）：断言是历史批次陆续写的，
      # 可能因环境差异（JDK/缓存/路径）报红，先出一份完整日志供排查。
      #
      # **真正的门禁在下一条 step（QA gate）**：它读同一份日志，只卡三件确定的事
      # （known-broken 清单非空 / 汇总 FAIL>0 / 出现 XPASS），
      # 不会因「某个 harness 因环境不具备而 SKIP」误伤。
      #
      # 回滚开关：仓库变量 QA_HARNESS=off 即可整步跳过，无需改代码。
      - name: QA harness (report only)
        if: ${{ vars.QA_HARNESS != 'off' }}
        continue-on-error: true
        # 注意：不要在这里显式写 env.POLARIS_SHIZUKU_ASSET。
        # 写入 $GITHUB_ENV 的变量会自动进入后续步骤的环境；用表达式覆盖反而可能在
        # 求值阶段取到空串，把运行时值抹掉，SKIP 逻辑就失效了。
        run: |
          set +e
          bash scripts/qa/run-all.sh app/build/outputs/apk/release/app-release.apk 2>&1 | tee /tmp/qa.log
          # tee 会吞掉左边的退出码，必须取 PIPESTATUS[0]，
          # 否则 run-all.sh 明明 FAIL=1，CI 看到的仍是 0。
          echo "runner exit=${PIPESTATUS[0]}" >> /tmp/qa.log

      # QA 硬门禁：防止失效项悄悄沉淀。
      #
      # 为什么必须有这道门：run-all.sh 把 known-broken.txt 里的 harness 归为 XFAIL，
      # **不阻塞构建**。这个设计本身对，但副作用是——一个新引入的失效 harness
      # 只要往清单里加一行，就能长期挂在 CI 上不被人发现。
      # 这道门禁把「沉淀」变成当场报红。
      #
      # 逃生阀：仓库变量 QA_GATE=warn 时只告警不失败（紧急止血用，默认硬失败）。
      - name: QA gate
        if: ${{ vars.QA_HARNESS != 'off' }}
        run: |
          bash scripts/qa/gate.sh /tmp/qa.log

      - name: QA harness summary
        if: always()
        run: |
          {
            echo "### QA harness（report only）+ QA gate（硬门禁）"
            echo ""
            echo '```'
            tail -80 /tmp/qa.log 2>/dev/null || echo "(无日志：该步被 QA_HARNESS=off 跳过，或脚本缺失)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 失败时只看 tail 定位不了（编译器内部错误的关键行在前面），完整日志随包上传
      - name: Upload QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-logs
          path: qa-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 额外把 APK 发到 latest Release，便于用 ghproxy 等加速镜像直链下载。
      # A 批：只在 main 发布；分支构建只上传 artifact，不碰 latest（否则推修复分支会把用户包换掉）。
      # 不再「先 delete 再 create」——删除会造成下载窗口 404，也是上一轮新旧包互相覆盖的帮凶。
      - name: Publish APK to Release (latest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          TITLE="北辰 latest (run ${{ github.run_number }})"
          NOTES="commit ${{ github.sha }}"
          # 先保证 release 存在（tag 已存在时 create 会失败，忽略即可）。
          gh release create "$TAG" app/build/outputs/apk/release/*.apk \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --notes "$NOTES" || true
          # 再覆盖上传 APK。
          #
          # 为什么要显式 upload --clobber 而不是只靠 create：
          # tag 已存在时 create 直接失败，APK 根本没换——旧包会被当成新包发出去，
          # 用户装到的是上一版的代码，还以为是最新的。
          gh release upload "$TAG" app/build/outputs/apk/release/*.apk \
            --repo "${{ github.repository }}" --clobber
          # 删掉历史遗留的 app-debug.apk：那个包 debuggable=true（同机应用可 run-as
          # 读走私有目录里的明文 API Key）。`--clobber` 只覆盖**同名**资产，
          # 旧名字会一直挂在 Release 上被旧链接和镜像继续分发——等于修复没生效。
          gh release delete-asset "$TAG" app-debug.apk \
            --repo "${{ github.repository }}" --yes || true
          # 最后把标题/说明也刷成当前这次的 run 号与 commit。
          #
          # 为什么要多这一步：原来只写「create || upload」，create 失败时走 upload 分支，
          # 而 upload **不会改 title**——于是 release 标题会永远停在首次创建时那个 run 号
          #（实测停在 "run 321"，而包其实已经是 run 334 的），看标题判断版本会判错。
          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --notes "$NOTES"
